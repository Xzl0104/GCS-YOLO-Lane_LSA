# GCS-YOLO-Lane default-off env30 GT4/GT5 static reference-bank v2 ablation.
# This preserves Q=12/K=56/fixed_y and changes only q5/q6/q7 initial
# reference geometry through a constrained visible-span bank.

nc: 1 # lane class placeholder required by Ultralytics model construction
imgsz: [544, 960] # H, W default for TuSimple 960x544
depth_multiple: 0.50 # YOLO11s depth
width_multiple: 0.50 # YOLO11s width

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4

  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, LSEM, []] # 5-P3/8

  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7-P4/16
  - [-1, 1, LSEM, []] # 8-P4/16

  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True]] # 10-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 11-P5/32
  - [-1, 2, C2PSA, [1024]] # 12-P5/32

head:
  - [[2, 5, 8, 12], 1, LaneBiFPN, [128]]
  - [-1, 1, GCSLaneHead, [12, 56, 3, 8, True, fixed_y, 0.9861111111111112, 0.2222222222222222, query, 5, 2, 5, 4, False, data/gcs_reference_banks/q12_env30_gt45_static_v2.json]]
