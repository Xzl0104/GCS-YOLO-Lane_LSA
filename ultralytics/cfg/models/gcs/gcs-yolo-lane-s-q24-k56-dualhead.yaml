# GCS-YOLO-Lane Q24 protected static-bank model with explicit Count and Quality Heads.
# This is a default-off 40-epoch diagnostic candidate; the default Q24 model is unchanged.

nc: 1
imgsz: [544, 960]
depth_multiple: 0.50
width_multiple: 0.50
gcs_mode: query

# Strict-passed Q24 static bank. The first 12 references preserve the Q12
# geometry; q12..q23 provide the protected GT5/GT4 capacity.
gcs_reference_bank: data/gcs_reference_banks/q24_protected_static_env30_best.json

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, LSEM, []]

  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, LSEM, []]

  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [[2, 5, 8, 12], 1, LaneBiFPN, [128]]
  # Args: Q, K, decoder layers, heads, aux, point mode, fixed-y start/end,
  # mode, slots, min/max lanes, count classes, count head, reference mode,
  # reference bank, quality head.
  - [-1, 1, GCSLaneHead, [24, 56, 3, 8, True, fixed_y, 0.9861111111111112, 0.2222222222222222, query, 5, 2, 5, 4, True, dualbank, data/gcs_reference_banks/q24_protected_static_env30_best.json, True]]
