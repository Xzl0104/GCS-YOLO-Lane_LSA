# GCS-YOLO-Lane query-mode local short-segment proposal v5.
# This keeps the env30 Q12/K56 fixed-y base path and v4 raw local-segment
# proposals, then adds a default-off replace-gate logit for selector training.
# Default decode remains unchanged; TEST stays closed until hard gates pass.

nc: 1 # lane class placeholder required by Ultralytics model construction
imgsz: [544, 960] # H, W default for TuSimple 960x544
depth_multiple: 0.50 # YOLO11s depth
width_multiple: 0.50 # YOLO11s width

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, LSEM, []]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, LSEM, []]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [[2, 5, 8, 12], 1, LaneBiFPN, [128]]
  - [-1, 1, GCSLaneHead, [12, 56, 3, 8, True, fixed_y, 0.9861111111111112, 0.2222222222222222, query, 5, 2, 5, 4, False, False, [0, -20, 20, -40, 40, -60, 60], True, [3, 4, 5, 6, 7, 8, 9, 10], 1, 480.0, True]]
