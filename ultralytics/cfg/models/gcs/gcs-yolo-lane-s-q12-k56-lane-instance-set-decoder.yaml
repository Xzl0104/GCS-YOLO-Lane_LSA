# GCS-YOLO-Lane lane-instance-set decoder candidate.
# Default-off experiment: preserves the normal Q12/K56 fixed-y contract but
# switches the experiment YAML's main query outputs to image-local
# lane-instance candidates generated from fused P2/P3 evidence.

nc: 1
imgsz: [544, 960]
depth_multiple: 0.50
width_multiple: 0.50

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, LSEM, []]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, LSEM, []]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [[2, 5, 8, 12], 1, LaneBiFPN, [128]]
  - [
      -1,
      1,
      GCSLaneHead,
      [
        12,
        56,
        3,
        8,
        True,
        fixed_y,
        0.9861111111111112,
        0.2222222222222222,
        query,
        5,
        2,
        5,
        4,
        False,
        False,
        8,
        False,
        False,
        False,
        8,
        False,
        False,
        False,
        False,
        False,
        0.6,
        8.0,
        True,
        16,
        4.0,
      ],
    ]
