# GCS-YOLO-Lane model configuration for CULane.
# CULane uses its own fixed-y K56 contract. The active TuSimple model remains unchanged.

# Parameters
nc: 1 # lane class placeholder required by Ultralytics model construction
imgsz: [384, 960] # H, W; CULane source images are 1640x590 (W x H)
depth_multiple: 0.50
width_multiple: 0.50

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4

  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, LSEM, []] # 5-P3/8

  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7-P4/16
  - [-1, 1, LSEM, []] # 8-P4/16

  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True]] # 10-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 11-P5/32
  - [-1, 2, C2PSA, [1024]] # 12-P5/32

# Structured lane head
head:
  - [[2, 5, 8, 12], 1, LaneBiFPN, [128]]
  # CULane candidate: no dense aux loss, with geometry-aware existence, two-stage refinement, gated P2/P3/P4 fusion, and proposal-state refinement.
  - [-1, 1, GCSLaneHead, [12, 56, 3, 8, False, fixed_y, 0.9983050847457627, 0.06610169491525424, query, 5, 0, 4, 5, False, 590, 589, 39, True, True, True, True]]
