# GCS-YOLO-Lane 5-25-3 algorithm with the current TuSimple K56 fixed-y contract.
# This preserves the 5-25-3 architecture and changes only Q/K/fixed-y anchors.

nc: 1 # lane class placeholder required by Ultralytics model construction
imgsz: [544, 960] # H, W default for TuSimple
depth_multiple: 0.50 # YOLO11s depth
width_multiple: 0.50 # YOLO11s width

# Head args:
# num_queries=12, num_points=56, decoder_layers=3, nhead=8, aux=True,
# point_mode=fixed_y, fixed_y_start=710/720, fixed_y_end=160/720

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, LSEM, []]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, LSEM, []]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [[2, 5, 8, 12], 1, LaneBiFPN, [128]]
  - [-1, 1, GCSLaneHead, [12, 56, 3, 8, True, fixed_y, 0.9861111111111112, 0.2222222222222222]]
