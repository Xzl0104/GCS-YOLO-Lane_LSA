gcs_lane_instance_empty_weight: 1.0 # (float) image-level empty/no-lane BCE weight
gcs_lane_instance_geometry_quality_weight: 1.0 # (float) matched geometry-quality calibration weight
gcs_lane_instance_survival_weight: 1.0 # (float) survivor confidence BCE weight
