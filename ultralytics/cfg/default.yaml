gcs_residual_exist_weight: 1.0 # (float) residual proposal existence BCE weight
gcs_residual_unmatched_weight: 0.05 # (float) unmatched residual negative weight
gcs_residual_min_lanes: 4 # (int) minimum GT lane count eligible for residual supervision
gcs_residual_min_visible: 3 # (int) minimum visible anchors eligible for residual supervision
