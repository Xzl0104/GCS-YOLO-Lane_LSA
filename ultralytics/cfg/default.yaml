# Global configuration YAML with settings and hyperparameters for YOLO training, validation, prediction and export
# For documentation see https://docs.ultralytics.com/usage/cfg/

task: detect # (str) YOLO task, i.e. detect, segment, classify, pose, obb
mode: train # (str) YOLO mode, i.e. train, val, predict, export, track, benchmark

# Train settings -------------------------------------------------------------------------------------------------------
model: # (str, optional) path to model file, i.e. yolov8n.pt or yolov8n.yaml
data: # (str, optional) path to data file, i.e. coco8.yaml
epochs: 100 # (int) number of epochs to train for
time: # (float, optional) max hours to train; overrides epochs if set
patience: 100 # (int) early stop after N epochs without val improvement
batch: 16 # (int | float) batch size as int (e.g. 16), or float 0.0–1.0 for AutoBatch fraction of GPU memory
imgsz: 640 # (int | list) train/val use int (square); predict/export may use [h,w]
save: True # (bool) save train checkpoints and predict results
save_period: -1 # (int) save checkpoint every N epochs; disabled if < 1
cache: False # (bool | str) cache images in RAM (True/'ram') or on 'disk' to speed dataloading; False disables
device: # (int | str | list) device: 0 or [0,1,2,3] for CUDA, 'cpu'/'mps', or -1/[-1,-1] to auto-select idle GPUs
workers: 8 # (int) dataloader workers (per RANK if DDP)
project: # (str, optional) project name for results root
name: # (str, optional) experiment name; results in 'project/name'
exist_ok: False # (bool) overwrite existing 'project/name' if True
pretrained: True # (bool | str) use pretrained weights (bool) or load weights from path (str)
optimizer: auto # (str) optimizer: SGD, MuSGD, Adam, Adamax, AdamW, NAdam, RAdam, RMSProp, or auto
verbose: True # (bool) print verbose logs during training/val
seed: 0 # (int) random seed for reproducibility
deterministic: True # (bool) enable deterministic ops; reproducible but may be slower
single_cls: False # (bool) treat all classes as a single class
rect: False # (bool) rectangular batches for train; rectangular batching for val when mode='val'
cos_lr: False # (bool) cosine learning rate scheduler
close_mosaic: 10 # (int) disable mosaic augmentation for final N epochs (0 to keep enabled)
resume: False # (bool) resume training from last checkpoint in the run dir
amp: True # (bool) Automatic Mixed Precision (AMP) training; True runs AMP capability check
fraction: 1.0 # (float) fraction of training dataset to use (1.0 = all)
profile: False # (bool) profile ONNX/TensorRT speeds during training for loggers
freeze: # (int | list, optional) freeze first N layers (int) or specific layer indices (list)
multi_scale: 0.0 # (float) multi-scale range as a fraction of imgsz; sizes are rounded to stride multiples
compile: False # (bool | str) enable torch.compile() backend='inductor'; True="default", False=off, or "default|reduce-overhead|max-autotune-no-cudagraphs"

# Segmentation
overlap_mask: True # (bool) merge instance masks into one mask during training (segment only)
mask_ratio: 4 # (int) mask downsample ratio (segment only)

# Classification
dropout: 0.0 # (float) dropout for classification head (classify only)

# Val/Test settings ----------------------------------------------------------------------------------------------------
val: True # (bool) run validation/testing during training
split: val # (str) dataset split to evaluate: 'val', 'test' or 'train'
save_json: False # (bool) save results to COCO JSON for external evaluation
conf: # (float, optional) confidence threshold; defaults: predict=0.25, val=0.001
iou: 0.7 # (float) IoU threshold used for NMS
max_det: 300 # (int) maximum number of detections per image
half: False # (bool) use half precision (FP16) if supported
dnn: False # (bool) use OpenCV DNN for ONNX inference
plots: True # (bool) save plots and images during train/val
end2end: # (bool, optional) whether to use end2end head (YOLO26, YOLOv10) for predict/val/export

# Predict settings -----------------------------------------------------------------------------------------------------
source: # (str, optional) path/dir/URL/stream for images or videos; e.g. 'ultralytics/assets' or '0' for webcam
vid_stride: 1 # (int) read every Nth frame for video sources
stream_buffer: False # (bool) True buffers all frames; False keeps the most recent frame for low-latency streams
visualize: False # (bool) visualize model features (predict) or TP/FP/FN confusion (val)
augment: False # (bool) apply test-time augmentation during prediction
agnostic_nms: False # (bool) class-agnostic NMS
classes: # (int | list[int], optional) filter by class id(s), e.g. 0 or [0,2,3]
retina_masks: False # (bool) use high-resolution segmentation masks (segment)
embed: # (list[int], optional) return feature embeddings from given layer indices

# Visualize settings ---------------------------------------------------------------------------------------------------
show: False # (bool) show images/videos in a window if supported
save_frames: False # (bool) save individual frames from video predictions
save_txt: False # (bool) save results as .txt files (xywh format)
save_conf: False # (bool) save confidence scores with results
save_crop: False # (bool) save cropped prediction regions to files
show_labels: True # (bool) draw class labels on images, e.g. 'person'
show_conf: True # (bool) draw confidence values on images, e.g. '0.99'
show_boxes: True # (bool) draw bounding boxes on images
line_width: # (int, optional) line width of boxes; auto-scales with image size if not set

# Export settings ------------------------------------------------------------------------------------------------------
format: torchscript # (str) target format, e.g. torchscript|onnx|openvino|engine|coreml|saved_model|pb|tflite|edgetpu|tfjs|paddle|mnn|ncnn|imx|rknn|executorch|axelera
keras: False # (bool) TF SavedModel only (format=saved_model); enable Keras layers during export
optimize: False # (bool) TorchScript only; apply mobile optimizations to the scripted model
int8: False # (bool) INT8/PTQ where supported (openvino, engine, coreml, tflite, tfjs, mnn, imx, axelera); needs calibration data/fraction
dynamic: False # (bool) dynamic shapes for torchscript, onnx, openvino, engine, coreml; enable variable image sizes
simplify: True # (bool) ONNX/engine only; run graph simplifier for cleaner ONNX before runtime conversion
opset: # (int, optional) ONNX/engine only; opset version for export; leave unset to use a tested default
workspace: # (float, optional) engine (TensorRT) only; workspace size in GiB, e.g. 4
nms: False # (bool) fuse NMS into exported model when backend supports; if True, conf/iou apply (agnostic_nms except coreml)

# Hyperparameters ------------------------------------------------------------------------------------------------------
lr0: 0.01 # (float) initial learning rate (SGD=1e-2, Adam/AdamW=1e-3)
lrf: 0.01 # (float) final LR fraction; final LR = lr0 * lrf
momentum: 0.937 # (float) SGD momentum or Adam beta1
weight_decay: 0.0005 # (float) weight decay (L2 regularization)
warmup_epochs: 3.0 # (float) warmup epochs (fractions allowed)
warmup_momentum: 0.8 # (float) initial momentum during warmup
warmup_bias_lr: 0.1 # (float) bias learning rate during warmup
box: 7.5 # (float) box loss gain
cls: 0.5 # (float) classification loss gain
cls_pw: 0.0 # (float) class weights power for handling class imbalance (0.0=disable, 1.0=full inverse frequency)
dfl: 1.5 # (float) distribution focal loss gain
pose: 12.0 # (float) pose loss gain (pose tasks)
kobj: 1.0 # (float) keypoint objectness loss gain (pose tasks)
rle: 1.0 # (float) rle loss gain (pose tasks)
angle: 1.0 # (float) oriented angle loss gain (obb tasks)
train_images: # (str, optional) explicit GCS-YOLO-Lane train image directory/list
train_gcs_labels: # (str, optional) explicit GCS-YOLO-Lane train labels_gcs directory
val_images: # (str, optional) explicit GCS-YOLO-Lane val image directory/list
val_gcs_labels: # (str, optional) explicit GCS-YOLO-Lane val labels_gcs directory
gcs_imgsz: # (list[int], optional) real GCS input shape as [height, width], e.g. [544, 960]
gcs_mode: query # (str) GCS head/loss/decode mode: query or ordered_slot
gcs_num_slots: 5 # (int) ordered_slot lane slots, fixed to 5 for TuSimple 2/3/4/5 lanes
gcs_min_lanes: 2 # (int) ordered_slot minimum representable TuSimple lane count
gcs_max_lanes: 5 # (int) ordered_slot maximum representable TuSimple lane count
gcs_count_classes: 4 # (int) ordered_slot count classes for 2/3/4/5 lanes
gcs_contiguity_policy: strict # (str) ordered_slot fixed-y valid-mask policy: strict or repair_interp
gcs_exist: 2.0 # (float) GCS lane existence loss gain
gcs_point: 15.0 # (float) GCS normalized point L1 loss gain
gcs_point_valid: 1.0 # (float) GCS per-point visibility BCE loss gain for fixed-y lane anchors
gcs_point_valid_unmatched_ignore: True # (bool) ignore GT-close Hungarian-unmatched visible anchors inside point-valid BCE
gcs_point_valid_unmatched_ignore_px: 30.0 # (float) mean x-distance threshold in training-image pixels for GT-close unmatched queries
gcs_point_valid_unmatched_ignore_anchor_px: 30.0 # (float) per-anchor x-distance threshold in pixels for ignored GT-visible anchors
gcs_point_valid_unmatched_ignore_min_overlap: 3 # (int) minimum GT-visible anchors required for unmatched ignore protection
gcs_smooth: 0.0 # (float) legacy GCS second-order smoothness loss gain; query five-loss contract ignores it
gcs_curve: 0.1 # (float) GCS adaptive curvature-aware loss gain
gcs_line_iou: 1.0 # (float) GCS visible lane-region IoU loss gain
gcs_line_iou_width_px: 18.0 # (float) visible lane-region IoU surrogate lane width in pixels
gcs_line_iou_temperature_px: 1.0 # (float) smooth distance temperature for visible lane-region IoU loss in pixels
gcs_line_iou_visibility: false # (bool) R1 prediction-visibility-aware soft region IoU ablation
gcs_exist_region_quality: false # (bool) R2 detached soft region-quality existence target ablation
gcs_mask: 0.0 # (float) legacy GCS auxiliary semantic mask loss gain; query five-loss contract ignores it
gcs_edge: 0.0 # (float) legacy GCS auxiliary edge loss gain; query five-loss contract ignores it
gcs_count: 0.0 # (float) GCS lane-count/cardinality loss gain; 0 disables
gcs_count_under5: 0.0 # (float) extra GCS undercount loss gain for dense-lane samples; 0 disables
gcs_count_under5_min_lanes: 5 # (int) minimum GT lane count that enables gcs_count_under5
gcs_count_boundary: 0.0 # (float) GT3/GT4/GT5 adjacent count-boundary loss gain; 0 disables
gcs_count_boundary_gt4_weight: 2.0 # (float) weight for GT4 lower/upper count-boundary terms
gcs_count_boundary_gt5_weight: 1.5 # (float) weight for GT5 undercount boundary term
gcs_count_boundary_gt5_under_weight: null # (float|None) optional separate GT5 undercount boundary weight; null follows gcs_count_boundary_gt5_weight
gcs_count_boundary_margin34: 0.35 # (float) margin for GT3 upper and GT4 lower count-score boundaries
gcs_count_boundary_margin45: 0.35 # (float) margin for GT4 upper and GT5 lower count-score boundaries
gcs_query_count_ce: 0.0 # (float) query-mode explicit Count Head CE gain; 0 disables
gcs_query_count_min_lanes: 2 # (int) query Count Head class 0 lane count
gcs_query_count_max_lanes: 5 # (int) query Count Head max lane count; classes cover 2/3/4/5
gcs_count_ce: 1.0 # (float) ordered_slot 2/3/4/5 count cross-entropy gain
gcs_interval: 1.0 # (float) ordered_slot start/end interval cross-entropy gain
gcs_order: 0.2 # (float) ordered_slot common-anchor adjacent-slot order loss gain
gcs_gt_bottom_order: 1.0 # (float) ordered_slot GT-bottom adjacent-slot order loss gain
gcs_decoded_bottom_order: 1.0 # (float) ordered_slot decoded-bottom adjacent-slot order loss gain
gcs_slot_gt_bottom_x: 0.0 # (float) ordered_slot decoded bottom-x to GT bottom-x regression gain; 0 disables
gcs_slot_gt_bottom_x_beta: 0.05 # (float) SmoothL1 beta for ordered_slot GT bottom-x regression in normalized x
gcs_slot_gt_bottom_x_detach_interval: 1 # (int) detach start/end logits when selecting decoded bottom index for GT bottom-x loss
gcs_slot_gt_bottom_x_soft: 0.0 # (float) ordered_slot differentiable soft-start GT bottom-x regression gain; 0 disables
gcs_slot_gt_bottom_x_soft_tau: 0.5 # (float) temperature for softmax over start logits in soft GT bottom-x loss
gcs_slot_gt_bottom_x_soft_beta: 0.05 # (float) SmoothL1 beta for soft GT bottom-x regression in normalized x
gcs_slot_start_index_l1: 0.0 # (float) ordered_slot differentiable soft start-index L1 gain; 0 disables
gcs_slot_start_index_l1_beta: 2.0 # (float) SmoothL1 beta for soft start-index L1 in anchor units
gcs_allow_disable_order_loss: False # (bool) allow ordered_slot order losses <= 0 only for an explicit ablation
gcs_slot_exist_w4: 1.0 # (float) ordered_slot slot4 existence BCE element weight; weights positive and negative targets
gcs_slot_exist_w5: 1.0 # (float) ordered_slot slot5 existence BCE element weight; weights positive and negative targets
gcs_min_interval_points: 2 # (int) ordered_slot minimum decoded start/end interval length
gcs_order_margin_px: 5.0 # (float) ordered_slot adjacent-slot x-order margin in pixels
gcs_bottom_order_margin_px: 2.0 # (float) ordered_slot bottom-x adjacent-slot order margin in pixels
gcs_ordered_point_loss: normalized_smooth_l1 # (str) ordered_slot point loss: normalized_smooth_l1, pixel_smooth_l1, or explicit aspect_l1 ablation
gcs_point_y_weight: 0.25 # (float) ordered_slot y-coordinate weight inside point loss
gcs_point_x_only: False # (bool) train ordered_slot point regression on x only
gcs_pixel_smoothl1_beta: 1.0 # (float) pixel-space SmoothL1 beta when gcs_ordered_point_loss=pixel_smooth_l1
gcs_spurious_neg: 0.0 # (float) extra BCE negative loss gain for short unmatched duplicate lane queries; 0 disables
gcs_spurious_neg_weight: 1.0 # (float) multiplier for the spurious negative loss term
gcs_spurious_gt3_weight: 1.0 # (float) per-image spurious-negative multiplier for GT3-or-sparser samples
gcs_spurious_gt4_weight: 1.0 # (float) per-image spurious-negative multiplier for GT4 samples
gcs_spurious_gt5_weight: 1.0 # (float) per-image spurious-negative multiplier for GT5-or-denser samples
gcs_spurious_disable_gt5: False # (bool) disable spurious-negative loss on GT5-or-denser samples
gcs_spurious_max_points: 12 # (int) maximum visible anchors for short spurious duplicate candidates
gcs_spurious_close_px: 30.0 # (float) maximum mean x distance in pixels to a matched query
gcs_spurious_min_overlap: 3 # (int) minimum overlapping visible anchors with a matched query
gcs_spurious_gt_protect: False # (bool) protect duplicate-like candidates that are close to a GT lane
gcs_spurious_gt_protect_px: 25.0 # (float) maximum mean x distance in pixels for GT-aware protection
gcs_spurious_gt_protect_min_overlap: 3 # (int) minimum overlapping anchors with a GT lane for protection
gcs_spurious_gt_protect_margin_px: 5.0 # (float) better-matched protection margin in pixels
gcs_spurious_gt_protect_mode: better_matched # (str) GT-aware protection policy
gcs_gt5_short_visible_thr: 0 # (int) matched GT5 lanes with visible_count <= this get point-valid positive rescue; 0 disables
gcs_gt5_short_point_valid_weight: 1.0 # (float) point-valid BCE multiplier for visible anchors of rescued short GT5 lanes
gcs_short_geom: 0.0 # (float) lane-level point/curve boost gain for matched GT4/GT5 short-visible lanes; 0 disables
gcs_short_geom_visible_thr: 10 # (int) visible anchor threshold for GT4/GT5 short geometry boost
gcs_short_geom_gt4_weight: 1.0 # (float) default-off GT4 short geometry boost
gcs_short_geom_gt5_weight: 2.0 # (float) target lane weight when gcs_short_geom=1.0
gcs_short_geom_max_weight: 3.0 # (float) maximum clamped lane weight for short geometry boost
gcs_short_geom_curve: 1.0 # (float) fraction of short geometry lane boost applied to curve_loss
gcs_boundary_pseudo_neg: 0.0 # (float) extra BCE negative loss gain for GT5 short far boundary pseudo lanes; 0 disables
gcs_boundary_pseudo_visible_thr: 10 # (int) maximum predicted visible anchors for boundary pseudo negatives
gcs_boundary_pseudo_dist_thr: 60.0 # (float) minimum mean x distance in pixels from nearest GT lane
gcs_boundary_pseudo_valid_thr: 0.5 # (float) predicted per-point visibility threshold for boundary pseudo negatives
gcs_boundary_pseudo_min_valid: 3 # (int) minimum predicted visible anchors for boundary pseudo negatives
gcs_boundary_pseudo_gt_count: 5 # (int) GT lane count targeted by boundary pseudo negatives
gcs_boundary_pseudo_score_thr: 0.0 # (float) optional existence score floor for boundary pseudo negatives; 0 disables
gcs_boundary_pseudo_envelope_margin_px: -1.0 # (float) require common-visible query anchors outside GT envelope by this margin; <0 disables
gcs_boundary_pseudo_envelope_ratio_thr: 0.75 # (float) minimum common-visible anchor ratio outside GT envelope when envelope margin is enabled
gcs_exist_pos_weight: 1.0 # (float) positive query weight for GCS lane existence BCE
gcs_exist_focal_gamma: 0.0 # (float) optional focal gamma for GCS existence BCE; 0 disables focal weighting
gcs_exist_focal_alpha: -1.0 # (float) optional focal alpha for GCS existence BCE; set 0..1 to enable alpha weighting
gcs_exist_quality_alpha: 0.0 # (float) legacy quality-aware existence target blend; query five-loss contract ignores it
gcs_exist_quality_mode: linear # (str) legacy compatibility only; active query five-loss ignores quality-aware existence targets
gcs_exist_quality_tau: 25.0 # (float) legacy compatibility only; active query five-loss ignores quality-aware existence targets
gcs_exist_quality_floor: 0.0 # (float) legacy compatibility only; active query five-loss ignores quality-aware existence targets
gcs_exist_quality_pos_px: 10.0 # (float) legacy compatibility only; active query five-loss ignores quality-aware existence targets
gcs_exist_quality_neg_px: 20.0 # (float) legacy compatibility only; active query five-loss ignores quality-aware existence targets
gcs_gt4_selective_exist_target_floor: 0.0 # (float) legacy compatibility only; active query five-loss uses hard matched existence targets
gcs_gt4_selective_exist_target_ape_max: 20.0 # (float) legacy compatibility only; active query five-loss uses hard matched existence targets
gcs_gt4_selective_exist_target_visible_thr: 10 # (int) legacy compatibility only; active query five-loss uses hard matched existence targets
gcs_point_valid_pos_weight_max: 10.0 # (float) maximum positive weight for GCS per-point visibility loss
gcs_mask_pos_weight_max: 20.0 # (float) maximum foreground class weight for GCS mask auxiliary loss
gcs_edge_pos_weight_max: 50.0 # (float) maximum foreground pos_weight for GCS edge auxiliary loss
gcs_aux_dice: 0.5 # (float) Dice loss gain inside GCS mask/edge auxiliary losses
gcs_curve_alpha: 5.0 # (float) GCS curvature weight scale
gcs_curve_weight_max: 5.0 # (float) GCS curvature weight clamp
gcs_cost_point: 5.0 # (float) Hungarian matching point-distance cost gain
gcs_cost_curve: 0.05 # (float) Hungarian matching pixel-curvature cost gain
gcs_cost_exist: 0.1 # (float) Hungarian matching existence-confidence cost gain
gcs_match_min_overlap: 2 # (int) minimum valid GT points required for training Hungarian matching
gcs_match_max_x_dist: 0.0 # (float) optional training matcher mean x-distance gate in pixels; 0 disables
gcs_match_gate_px: 160.0 # (float) training matcher APE gate in pixels; 0 disables
gcs_eval_conf: 0.2 # (float) GCS validation lane existence threshold for Precision/Recall/F1; quality-aware exist is calibrated lower
gcs_eval_ape_thr: 20.0 # (float) GCS validation APE threshold in pixels for TP matching
gcs_eval_match_gate_px: # (float, optional) strict validation APE gate; null defaults to gcs_eval_ape_thr
gcs_eval_max_x_dist: 0.0 # (float) optional strict validation mean x-distance gate in pixels; 0 disables
gcs_eval_min_overlap: 2 # (int) minimum valid overlapping GT points required for strict validation matching
gcs_eval_nms_dist_px: 50.0 # (float) optional lane duplicate suppression distance in pixels; 0 disables
gcs_eval_point_valid_thr: 0.5 # (float) per-point visibility threshold used when decoding fixed-y lanes for validation
gcs_eval_max_det: 8 # (int) maximum decoded lane queries kept for GCS validation metrics
dataset: tusimple # (str) dataset identity used by dataset-specific training hooks
gcs_culane_val: False # (bool) run periodic CULane region-IoU validation and preserve the best F1 checkpoint
gcs_culane_val_interval: 5 # (int) epoch interval for periodic CULane region-IoU validation
gcs_culane_external_fitness: false # (bool) use saved external CULane F1 for early stopping
gcs_culane_val_source: # (str, optional) CULane validation image directory
gcs_culane_val_labels: # (str, optional) CULane validation labels_gcs directory
gcs_culane_val_archive_root: # (str, optional) extracted CULane root containing original .lines.txt annotations
gcs_culane_val_conf: 0.2 # (float) CULane validation lane existence threshold
gcs_culane_val_point_valid_thr: 0.4 # (float) CULane validation per-point visibility threshold
gcs_culane_val_nms_dist_px: 50.0 # (float) CULane validation lane NMS distance in pixels
gcs_culane_val_max_det: 5 # (int) CULane validation maximum decoded lanes per image
gcs_culane_val_max_images: 0 # (int) limit CULane validation images; 0 means all
gcs_culane_val_warmup: 5 # (int) untimed warmup forwards before CULane validation
gcs_culane_val_half: False # (bool) use FP16 inference for CULane validation
gcs_official_best: False # (bool) run periodic TuSimple official-val sweeps and preserve weights/official_best.pt
gcs_allow_internal_best: False # (bool) allow ordered_slot debug training without official_best checkpoint selection
gcs_official_interval: 5 # (int) epoch interval for periodic official-val checkpoint selection
gcs_official_archive_root: archive # (str) path to archive/ or archive/TUSimple for official-val selection
gcs_official_gt_json: # (str, optional) explicit official-val GT json-lines file
gcs_official_allow_noncanonical_gt: False # (bool) allow noncanonical official-val GT only for diagnostics
gcs_official_max_images: 0 # (int) limit official-val images per hook; 0 means all
gcs_official_warmup: 5 # (int) warmup forwards for training-time official sweeps
gcs_official_confs: [0.005, 0.01, 0.02, 0.05, 0.1] # (list[float]) official-val sweep existence thresholds
gcs_official_point_valid_thrs: [0.45, 0.5] # (list[float]) official-val sweep point-valid thresholds
gcs_official_nms_dist_pxs: [0.0, 18.0, 30.0, 50.0] # (list[float]) official-val sweep lane NMS distances
gcs_official_max_dets: [5, 6, 8] # (list[int]) official-val sweep max_det values
gcs_official_min_points: [4, 5, 6] # (list[int]) official-val sweep visible-anchor floors
gcs_official_valid_before_maxdet: False # (bool) filter point-valid/min_points failures before max_det in official sweeps
gcs_official_count_modes: [score_sum] # (list[str]) query count-aware top-k count sources for official sweeps
gcs_official_score_fp_weight: 0.02 # (float) FP penalty for official_score tie-break logging
gcs_official_score_fn_weight: 0.02 # (float) FN penalty for official_score tie-break logging
gcs_official_half: False # (bool) use FP16 inference for training-time official sweeps
# Keep disabled by default to preserve training-distribution comparability.
# Enable explicitly for count-balanced ordered_slot experiments.
gcs_lane_count_balanced: False # (bool) sample GCS training images with inverse-frequency lane-count weights
gcs_lane_count_balance_power: 1.0 # (float) lane-count sampler exponent; 1.0 gives equal lane-count groups
gcs_lane_count_min_group: 50 # (int) minimum group size used to smooth lane-count sampler weights
gcs_hard_sampling: False # (bool) train-only hard sampling for 0601 and short-visible GT3/GT4/GT5 samples
gcs_hard_date_0601_weight: 2.0 # (float) multiplier for TuSimple 0601 samples
gcs_hard_gt4_le10_weight: 4.0 # (float) multiplier for GT4 samples with min_visible_points <= gcs_hard_visible_thr
gcs_hard_gt5_le10_weight: 3.0 # (float) multiplier for GT5 samples with min_visible_points <= gcs_hard_visible_thr
gcs_hard_gt3_le20_weight: 1.5 # (float) multiplier for GT3 samples with min_visible_points <= gcs_hard_gt3_visible_thr
gcs_hard_0313_2_gt4_le10_weight: 4.0 # (float) extra multiplier for 0313-2 GT4 short-visible samples
gcs_hard_visible_thr: 10 # (int) visible-point threshold for GT4/GT5 hard-sampling groups
gcs_hard_gt3_visible_thr: 20 # (int) visible-point threshold for GT3 hard-sampling group
nbs: 64 # (int) nominal batch size used for loss normalization
hsv_h: 0.015 # (float) HSV hue augmentation fraction
hsv_s: 0.7 # (float) HSV saturation augmentation fraction
hsv_v: 0.4 # (float) HSV value (brightness) augmentation fraction
degrees: 0.0 # (float) rotation degrees (+/-)
translate: 0.1 # (float) translation fraction (+/-)
scale: 0.5 # (float) scale gain (+/-)
shear: 0.0 # (float) shear degrees (+/-)
perspective: 0.0 # (float) perspective fraction (0–0.001 typical)
flipud: 0.0 # (float) vertical flip probability
fliplr: 0.5 # (float) horizontal flip probability
bgr: 0.0 # (float) RGB↔BGR channel swap probability
mosaic: 1.0 # (float) mosaic augmentation probability
mixup: 0.0 # (float) MixUp augmentation probability
cutmix: 0.0 # (float) CutMix augmentation probability
copy_paste: 0.0 # (float) segmentation copy-paste probability
copy_paste_mode: flip # (str) copy-paste strategy for segmentation: flip or mixup
auto_augment: randaugment # (str) classification auto augmentation policy: randaugment, autoaugment, augmix
erasing: 0.4 # (float) random erasing probability for classification (0.0–1.0)

# Custom config.yaml ---------------------------------------------------------------------------------------------------
cfg: # (str, optional) path to a config.yaml that overrides defaults

# Tracker settings ------------------------------------------------------------------------------------------------------
tracker: botsort.yaml # (str) tracker config file: botsort.yaml or bytetrack.yaml
