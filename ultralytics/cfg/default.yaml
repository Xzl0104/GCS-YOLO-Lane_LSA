gcs_residual_quality_rank_target_gap: 0.0 # (float) minimum soft-target gap used by pairwise ranking
gcs_residual_quality_hard_weight: 1.0 # (float) quality/rank multiplier on images with short base-miss targets
gcs_residual_identity_margin: 0.2 # (float) maximum allowed cosine similarity for different-lane proposals
gcs_residual_identity_assign_px: 30.0 # (float) geometry gate for assigning proposals to lane identities
gcs_residual_quality_pos_weight_max: 20.0 # (float) maximum quality BCE positive weight
gcs_residual_replace_weight: 0.0 # (float) proposal-victim safe replacement BCE weight; 0 disables
gcs_residual_replace_pos_weight_max: 50.0 # (float) maximum proposal-victim positive BCE weight
gcs_residual_replace_hit_px: 20.0 # (float) full-span geometry threshold for replacement utility targets
gcs_residual_replace_soft_px: 0.0 # (float) >0 enables continuous base-miss replacement utility up to this APE
gcs_residual_replace_official_delta_scale: 0.0 # (float) >0 enables TuSimple official set-utility replacement targets
